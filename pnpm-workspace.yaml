packages:
  - apps/*
  - packages/*
  - services/*

# Native/binary builds are opt-in; anything not listed is denied.
allowBuilds:
  esbuild: true

# Supply-chain rule: only releases at least two weeks old (minutes).
minimumReleaseAge: 20160

# SolidCash 0.51.0 (solidc, solidcash, utils) depends on @bitauth/libauth from the author's fork, pinned by commit:
# git+https://github.com/mainnet-pat/libauth.git#1cf4b432864b3a4ed9f33d1992355d7286f3dab8 ("expose build/ subpaths
# through the package exports map", 2026-10-08). pnpm blocks git sub-dependencies by default; the S00 bake-off needs
# SolidCash as published, so this is allowed. Revisit at decision D16.
blockExoticSubdeps: false

# SolidCash 0.51.0's SDK imports '@noble/curves/secp256k1' (ecrecover side-cars) without declaring the package; its own
# monorepo resolves it by hoisting. The bare subpath exists only in @noble/curves 1.x (2.x exports './secp256k1.js').
packageExtensions:
  "@solidcash/solidcash@0.51.0":
    dependencies:
      "@noble/curves": 1.9.7

# One version per shared dependency across apps, packages and services.
catalog:
  typescript: ~6.0.3
  "@types/node": ^24
  zod: 4.6.5
  # AI (S07): the Vercel AI SDK and the providers the model resolver can reach directly.
  ai: 7.0.162
  "@ai-sdk/openai": 4.0.108
  "@dicebear/core": 9.4.3
  "@dicebear/notionists": 9.4.2
  "@ai-sdk/anthropic": 4.0.96
  "@ai-sdk/react": 4.0.166
  cashscript: 0.14.0
  cashc: 0.14.0
  "@cashscript/utils": 0.14.0
  "@bitauth/libauth": 3.0.0
  "@electrum-cash/network": 4.4.8
  "@generalprotocols/price-oracle": 4.0.0
  "@solidcash/solidcash": 0.51.0
  "@solidcash/solidc": 0.51.0
  "@solidcash/utils": 0.51.0
  "@wizardconnect/core": 0.2.10
  "@wizardconnect/dapp": 0.2.7
  "@wizardconnect/react": 0.2.6
  uqr: 0.1.3
  mediabunny: 1.65.1
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  postgres: 3.4.9
  "@rpckit/core": 2.2.0
  "@rpckit/fallback": 2.2.0
  "@rpckit/websocket": 2.2.0
  eventsource-parser: 4.1.3
  # Web Push (S08): 4.0.0 is inside the two-week window; 3.6.7 is the long-standing release.
  web-push: 3.6.7
  "@types/web-push": 3.6.4
  next: 16.4.5
  server-only: 0.0.1
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  lucide-react: 1.66.0
  "@number-flow/react": 0.6.2
  "@tanstack/react-query": 5.105.2
  "@web3icons/core": 4.0.58
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.9"
  - "@turbo/darwin-arm64@2.11.9"
  - "@turbo/linux-64@2.11.9"
  - "@turbo/linux-arm64@2.11.9"
  - "@turbo/windows-64@2.11.9"
  - "@turbo/windows-arm64@2.11.9"
  - turbo@2.11.9
  # The S00 language bake-off has to measure the SolidCash release that exists today (0.51.0, 2026-11-16).
  - "@solidcash/solidcash@0.51.0"
  - "@solidcash/solidc@0.51.0"
  - "@solidcash/utils@0.51.0"
  # WizardConnect is BLAZE's required wallet connection; these releases (2026-11-12/13) are what wallets speak now.
  - "@wizardconnect/core@0.2.10"
  - "@wizardconnect/dapp@0.2.7"
  - "@wizardconnect/react@0.2.6"
  # SolidCash's SDK depends on these (published 2026-11-03, 13 days before the bake-off).
  - "@mem-cash/core@0.0.11"
  - "@mem-cash/electrum@0.0.11"
  - "@mem-cash/storage@0.0.11"
  - "@mem-cash/types@0.0.11"
  - "@mem-cash/validation@0.0.11"
